<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Cpath d='M32 32 L12 16 M32 32 L52 14 M32 32 L52 50 M32 32 L12 50' stroke='%2358a6ff' stroke-width='2' opacity='0.7'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2358a6ff'/%3E%3Ccircle cx='12' cy='16' r='5' fill='%232ecc71'/%3E%3Ccircle cx='52' cy='14' r='5' fill='%233498db'/%3E%3Ccircle cx='52' cy='50' r='5' fill='%23e74c3c'/%3E%3Ccircle cx='12' cy='50' r='5' fill='%238892a0'/%3E%3C/svg%3E">
<title>DRN 圆形网络 Demo</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2333; --line:#2d333b;
    --text:#e6edf3; --dim:#8b949e; --acc:#58a6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:1280px;margin:0 auto;padding:16px}
  header{padding:10px 4px 14px}
  h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:14px;margin-top:6px;line-height:1.7}
  .sub b{color:var(--acc);font-weight:600}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:14px}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .net-card{display:flex;flex-direction:column}
  svg#net{width:100%;height:auto;display:block;background:radial-gradient(circle at 50% 42%,#131a26 0%,#0b0f16 72%)}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;padding:8px 2px 2px;font-size:12px;color:var(--dim)}
  .legend .item{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .swatch{width:16px;height:4px;border-radius:2px;display:inline-block}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
         padding:10px 16px;font-size:14px;cursor:pointer;transition:.15s;min-height:44px}
  button:hover{border-color:var(--acc);color:#fff}
  button.active{background:var(--acc);color:#0d1117;border-color:var(--acc);font-weight:600}
  .steps{display:flex;gap:6px;align-items:center;margin:4px 0 12px}
  .stepdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .stepdot.on{background:var(--acc);color:#0d1117;border-color:var(--acc);font-weight:700}
  h3{font-size:13px;color:var(--dim);font-weight:600;margin:14px 0 8px;letter-spacing:.5px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .stat .k{font-size:11px;color:var(--dim)}
  .stat .v{font-size:16px;font-weight:700;margin-top:2px}
  .motor-list{margin-top:4px}
  .motor-row{display:flex;align-items:center;gap:8px;margin:5px 0}
  .motor-row .nm{width:64px;font-size:11px;color:var(--dim);flex:none}
  .motor-bar{flex:1;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .motor-fill{height:100%;width:0%;background:linear-gradient(90deg,#e74c3c,#ff6b6b);border-radius:5px;transition:width .3s}
  .motor-val{width:44px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;color:var(--text)}
  .note{font-size:11px;color:var(--dim);line-height:1.7;margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  footer{color:#484f58;font-size:11px;text-align:center;padding:18px 0 8px}
  .tip{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DRN 圆形网络 Demo</h1>
    <div class="sub">随机 <b>100 神经元</b> 网络：5 视觉 · 5 听觉 · 10 运动 · 80 普通。
      每个神经元随机伸出突触（W、B 随机），信号沿突触传递。
      视觉 / 听觉输入释放 <b>1.0</b> 信号，单步传播 <b>4 跳</b>，不做回响、不做可塑性。</div>
  </header>

  <div class="layout">
    <div class="card net-card">
      <svg id="net" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
      <div class="legend" id="legend"></div>
    </div>

    <div>
      <div class="card">
        <div class="controls">
          <button id="btnPlay">播放</button>
          <button id="btnPrev">上一步</button>
          <button id="btnNext">下一步</button>
          <button id="btnReset">重置</button>
        </div>
        <div class="steps" id="steps"></div>
        <h3>当前步统计</h3>
        <div class="stat-grid">
          <div class="stat"><div class="k">激活神经元（|y|&gt;0.05）</div><div class="v" id="stActive">-</div></div>
          <div class="stat"><div class="k">最大 |y|</div><div class="v" id="stMax">-</div></div>
          <div class="stat"><div class="k">视觉平均</div><div class="v" id="stVis">-</div></div>
          <div class="stat"><div class="k">听觉平均</div><div class="v" id="stAud">-</div></div>
          <div class="stat"><div class="k">普通平均</div><div class="v" id="stNor">-</div></div>
          <div class="stat"><div class="k">运动输出平均</div><div class="v" id="stMot">-</div></div>
        </div>
        <h3>运动神经元输出（act ∈ [0,1]）</h3>
        <div class="motor-list" id="motorList"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
  </div>
  <footer>DRN 量化版 · 圆形网络原型演示（随机连接，示意性质）</footer>
</div>

  g.appendChild(c);
  gNodes.appendChild(g);
  nodeEls.push({g, halo, c, node: n});
});

const edgeEls = [];
DATA.synapses.forEach(s => {
  const p1 = POS[s.pre], p2 = POS[s.post];
  const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
  // 控制点：中点沿径向向外偏移（让连线呈弧线、减少重叠）
  const dx = mx - CX, dy = my - CY;
  const dl = Math.sqrt(dx * dx + dy * dy) || 1;
  const k = 26 + Math.abs(s.W) * 40;
  const cxp = mx + (dx / dl) * k, cyp = my + (dy / dl) * k;
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", `M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q${cxp.toFixed(1)} ${cyp.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`);
  path.setAttribute("fill", "none");
  const info = SIGNAL_INFO.find(x => x.key === s.signal);
  path.setAttribute("stroke", info.color);
  path.setAttribute("stroke-width", (0.4 + Math.abs(s.W) * 1.6).toFixed(2));
  path.setAttribute("opacity", 0.16);
  path.setAttribute("data-pre", s.pre);
  gEdges.appendChild(path);
  edgeEls.push({path, s});
});

// ---------- 图例 ----------
const legendEl = document.getElementById("legend");
Object.entries(NODE_NAMES).forEach(([key, name]) => {
  const item = document.createElement("span");
  item.className = "item";
  item.innerHTML = `<span class="dot" style="background:${NODE_COLORS[key]}"></span>${name}神经元`;
  legendEl.appendChild(item);
});
SIGNAL_INFO.forEach(si => {
  const item = document.createElement("span");
  item.className = "item";
  item.innerHTML = `<span class="swatch" style="background:${si.color}"></span>${si.name}`;
  legendEl.appendChild(item);
});

// ---------- 步进控件 ----------
const stepsEl = document.getElementById("steps");
const TOTAL = HISTORY.length;
for (let i = 0; i < TOTAL; i++){
  const d = document.createElement("div");
  d.className = "stepdot";
  d.textContent = "t" + i;
  d.addEventListener("click", () => { stopAuto(); cur = i; render(); });
  stepsEl.appendChild(d);
}
const stepDots = [...stepsEl.children];
const btnPlay = document.getElementById("btnPlay");
const btnPrev = document.getElementById("btnPrev");
const btnNext = document.getElementById("btnNext");
const btnReset = document.getElementById("btnReset");

let cur = 0;
let timer = null;

function stopAuto(){
  if (timer){ clearInterval(timer); timer = null; btnPlay.textContent = "播放"; }
}
function startAuto(){
  stopAuto();
  btnPlay.textContent = "暂停";
  timer = setInterval(() => {
    if (cur >= TOTAL - 1){ stopAuto(); return; }
    cur++; render();
  }, 850);
}
btnPlay.addEventListener("click", () => { if (timer) stopAuto(); else startAuto(); });
btnPrev.addEventListener("click", () => { stopAuto(); cur = Math.max(0, cur - 1); render(); });
btnNext.addEventListener("click", () => { stopAuto(); cur = Math.min(TOTAL - 1, cur + 1); render(); });
btnReset.addEventListener("click", () => { stopAuto(); cur = 0; render(); });

// ---------- 渲染 ----------
const stActive = document.getElementById("stActive");
const stMax = document.getElementById("stMax");
const stVis = document.getElementById("stVis");
const stAud = document.getElementById("stAud");
const stNor = document.getElementById("stNor");
const stMot = document.getElementById("stMot");
const motorList = document.getElementById("motorList");
const note = document.getElementById("note");

function fmt(v){ return (v >= 0 ? "+" : "") + v.toFixed(3); }

function render(){
  stepDots.forEach((d, i) => d.classList.toggle("on", i === cur));
  const ys = HISTORY[cur];

  // 节点
  nodeEls.forEach(({g, halo, c, node}) => {
    const y = ys[node.id];
    const act = Math.abs(y);
    const base = NODE_COLORS[node.type];
    // 激活亮度 / 抑制偏紫
    let fill = base;
    if (y > 0.05) fill = "#ffffff";
    else if (y < -0.05) fill = "#a78bfa";
    c.setAttribute("fill", fill);
    c.setAttribute("r", (node.type === "normal" ? 5.5 : 7.5) + act * 4);
    halo.setAttribute("opacity", Math.min(0.85, act * 1.6));
    halo.setAttribute("r", 6 + act * 14);
    c.setAttribute("stroke", y > 0.05 ? "#ffffff" : "#0d1117");
  });

  // 突触：前神经元激活 → 高亮流动
  edgeEls.forEach(({path, s}) => {
    const preY = ys[s.pre];
    const on = Math.abs(preY) > 0.05;
    path.setAttribute("opacity", on ? 0.85 : 0.16);
    path.setAttribute("stroke-width", on ? (1.2 + Math.abs(s.W) * 2.4).toFixed(2) : (0.4 + Math.abs(s.W) * 1.6).toFixed(2));
    path.setAttribute("stroke-dasharray", on ? "6 5" : "none");
    path.setAttribute("stroke-linecap", on ? "round" : "butt");
  });

  // 统计
  let actCnt = 0, mx = 0;
  const sums = {visual: 0, auditory: 0, normal: 0, motor: 0};
  const cnts = {visual: 0, auditory: 0, normal: 0, motor: 0};
  DATA.neurons.forEach(n => {
    const y = ys[n.id];
    if (Math.abs(y) > 0.05) actCnt++;
    mx = Math.max(mx, Math.abs(y));
    sums[n.type] += y; cnts[n.type]++;
  });
  stActive.textContent = actCnt + " / " + N;
  stMax.textContent = mx.toFixed(3);
  stVis.textContent = (sums.visual / cnts.visual).toFixed(3);
  stAud.textContent = (sums.auditory / cnts.auditory).toFixed(3);
  stNor.textContent = (sums.normal / cnts.normal).toFixed(3);
  stMot.textContent = (sums.motor / cnts.motor).toFixed(3);

  // 运动输出条
  motorList.innerHTML = "";
  const motors = DATA.neurons.filter(n => n.type === "motor").sort((a, b) => ys[b.id] - ys[a.id]);
  motors.forEach(n => {
    const act = ys[n.id];
    const row = document.createElement("div");
    row.className = "motor-row";
    row.innerHTML = `<span class="nm">运动#${n.id}</span>
      <div class="motor-bar"><div class="motor-fill" style="width:${(act * 100).toFixed(0)}%"></div></div>
      <span class="motor-val">${act.toFixed(3)}</span>`;
    motorList.appendChild(row);
  });

  note.textContent = "t=" + cur + "：感官神经元在 t=0 注入 1.0，" +
    (cur === 0 ? "信号刚从视觉/听觉神经元出发。" :
     "信号已传播 " + cur + " 跳；w 多为 ±0.8 以内、b 做减法，多跳后信号自然衰减。");
}

render();
</script>
</body>
</html>

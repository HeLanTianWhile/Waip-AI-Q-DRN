<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Q-DRN · ChatUI（AI 视角 · 390×844）</title>
<style>
  :root{
    --bg:#0f0f0f;
    --panel:#171717;
    --panel-2:#131313;
    --line:#292929;
    --text:#e3e3e3;
    --muted:#888888;
    --accent:#979797;
    --accent-dim:#646464;
    --user:#242424;
    --ai:#232323;
    --screen-w:390px;   /* 手机屏 CSS 宽，固定 */
    --screen-h:844px;   /* 手机屏 CSS 高，固定 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#050505;
    color:var(--text);
    font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    cursor:none;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ── 固定尺寸的手机屏：390 × 844，不随窗口缩放 ── */
  #app{
    position:relative;
    width:var(--screen-w);height:var(--screen-h);
    flex:0 0 auto;
    overflow:hidden;
    display:flex;flex-direction:column;
    background:var(--bg);
    box-shadow:0 0 0 1px #2a2a2a, 0 18px 60px rgba(0,0,0,.8);
  }

  /* ── 状态条 ── */
  .status{
    height:26px;flex:0 0 auto;
    display:flex;align-items:center;gap:10px;
    padding:0 10px;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
    font-size:10.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;
  }
  .status .tag{
    padding:1px 7px;border:1px solid var(--line);border-radius:999px;
    color:var(--text);flex:0 0 auto;
  }
  .status .tag.ime{border-color:#3a3a3a;color:var(--accent)}
  .status .mono{font-family:Consolas,"Courier New",monospace;color:#adadad}
  .status .grow{flex:1}

  /* ── 聊天区 ── */
  .log{
    flex:1 1 auto;overflow-y:auto;
    padding:14px 12px 10px;
    display:flex;flex-direction:column;gap:10px;
  }
  .msg{
    max-width:86%;
    padding:8px 11px;
    border-radius:9px;
    line-height:1.65;
    font-size:13.5px;
    border:1px solid var(--line);
  }
  .msg.user{align-self:flex-start;background:var(--user)}
  .msg.ai{align-self:flex-end;background:var(--ai);border-color:#2e2e2e}
  .msg .who{
    display:block;font-size:10px;letter-spacing:1px;
    color:var(--muted);margin-bottom:3px;
  }
  .msg.ai .who{color:var(--accent)}
  .log::-webkit-scrollbar{width:5px}
  .log::-webkit-scrollbar-thumb{background:#252525;border-radius:3px}

  /* ── 候选栏 ── */
  .candbar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:5px 10px;
    border-top:1px solid var(--line);
    background:var(--panel);
    min-height:34px;
    overflow-x:auto;
  }
  .candbar .lbl{font-size:10px;color:var(--muted);letter-spacing:1px;flex:0 0 auto}
  .cand{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 8px;border:1px solid var(--line);border-radius:5px;
    background:var(--panel-2);font-size:14px;color:var(--text);
    flex:0 0 auto;transition:.12s;
  }
  .cand .num{font-size:9px;color:var(--muted);font-family:Consolas,monospace}
  .cand.on{border-color:var(--accent-dim);color:#e8e8e8}

  /* ── 输入框 ── */
  .composer{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;
    border-top:1px solid var(--line);
    background:var(--panel-2);
  }
  .field{
    flex:1;min-height:32px;
    display:flex;align-items:center;flex-wrap:wrap;
    gap:2px;padding:4px 9px;
    border:1px solid var(--line);border-radius:7px;
    background:#121212;
    font-size:13.5px;line-height:1.5;
    overflow:hidden;
  }
  .field .done{color:var(--text)}
  .field .comp{
    color:var(--accent);
    border-bottom:1.5px solid var(--accent-dim);
    padding-bottom:1px;
    font-family:Consolas,monospace;letter-spacing:1px;
  }
  .caret{width:1.5px;height:16px;background:var(--accent);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .field .ph{color:#4f4f4f;font-size:12px}
  .sendbtn{
    flex:0 0 auto;
    padding:7px 12px;border:1px solid var(--accent-dim);border-radius:7px;
    color:var(--accent);background:#151515;font-size:12.5px;
  }

  /* ── 屏幕软键盘（4 行，弹性宽度铺满 390） ── */
  .kb{
    flex:0 0 auto;
    padding:5px 5px 9px;
    border-top:1px solid var(--line);
    background:var(--panel);
    display:flex;flex-direction:column;gap:5px;
  }
  .kbrow{display:flex;gap:5px;width:100%}
  .key{
    flex:1 1 0;min-width:0;height:36px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:5px;
    background:#151515;color:#adadad;
    font-size:13px;font-family:Consolas,monospace;
    white-space:nowrap;overflow:hidden;
    transition:.08s;
  }
  .key.active{background:#232323;border-color:var(--accent-dim);color:#e8e8e8}
  .key.wide{flex:2 1 0;font-family:inherit;font-size:12px}
  .key.xwide{flex:3 1 0;font-family:inherit;font-size:12px}
  .key.fn{color:#979797;border-color:#2e2e2e}

  /* ── 光标 + 视网膜采样窗（390×192 满宽横条，只上下平移） ── */
  #aperture{
    position:absolute;left:0;top:0;
    width:390px;height:192px;margin:-96px 0 0 -195px;
    pointer-events:none;z-index:96;
    filter:grayscale(1);
    border:1px solid rgba(255,255,255,.5);
  }
  #aperture .grid{
    position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(0deg,  rgba(255,255,255,.06) 0 1px, transparent 1px 16px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 16px),
      radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.035), transparent 70%);
  }
  #aperture .lbl{
    position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
    font:10px/1 Consolas,monospace;letter-spacing:.5px;
    color:rgba(255,255,255,.6);white-space:nowrap;
    background:rgba(15,15,15,.88);padding:2px 5px;border-radius:3px;
  }
  #cursor{
    position:absolute;left:0;top:0;width:20px;height:20px;
    pointer-events:none;z-index:99;transform:translate(-1px,-1px);
  }
  #cursor svg{width:20px;height:20px;display:block}
  #clickring{
    position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;
    border:1.5px solid rgba(255,255,255,.85);border-radius:50%;
    pointer-events:none;opacity:0;z-index:98;
  }
  #clickring.go{animation:ring .55s ease-out}
  @keyframes ring{
    0%{opacity:.9;transform:scale(.5)}
    100%{opacity:0;transform:scale(1.2)}
  }
</style>
</head>
<body>

<div id="app">

  <div class="status">
    <span class="tag ime" id="imeTag">中文（拼音）</span>
    <span>光标 <span class="mono" id="curXY">195, 422</span></span>
    <span>视野 <span class="mono" id="viewY">422</span></span>
    <span>采样 <span class="mono">390×192</span></span>
    <span class="grow"></span>
    <span class="mono" id="sideTag">AI 端</span>
  </div>

  <div class="log" id="log"></div>

  <div class="candbar">
    <span class="lbl">候选</span>
    <div id="cands"></div>
  </div>

  <div class="composer">
    <div class="field" id="field">
      <span class="ph" id="ph">点击屏幕键盘输入…</span>
      <span class="done" id="done"></span>
      <span class="comp" id="comp"></span>
      <span class="caret"></span>
    </div>
    <button class="sendbtn" id="send">发送</button>
  </div>

  <div class="kb" id="kb"></div>

  <div id="aperture">
    <div class="grid"></div>
    <div class="lbl">390×192 · 灰阶</div>
  </div>

  <div id="cursor">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M4 2 L4 20 L9.2 15.2 L12.4 22 L15.2 20.6 L12 14 L19 13.6 Z"
            fill="#e8e8e8" stroke="#0b0b0b" stroke-width="1.4"/>
      <circle cx="11" cy="9" r="5.2" stroke="#ffffff" stroke-width="1.1" opacity=".55"/>
    </svg>
  </div>

  <div id="clickring"></div>
</div>

<script>
/* side=user 是真人用户端；默认仍为 AI 端，训练/按键测量行为不变。 */
const IS_USER = new URLSearchParams(location.search).get("side") === "user";
const SIDE = IS_USER ? "user" : "ai";
const outbox = [];

/* ───────── 键盘布局：4 行，弹性铺满 390 ───────── */
const ROWS = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["中/英","z","x","c","v","b","n","m","⌫"],
  ["，","空格","？","Enter"],
];
const kb = document.getElementById("kb");
ROWS.forEach((row, ri) => {
  const div = document.createElement("div");
  div.className = "kbrow";
  row.forEach(k => {
    const el = document.createElement("div");
    el.className = "key";
    el.textContent = k;
    el.dataset.k = k;
    if (k === "空格") el.classList.add("xwide");
    else if (k.length > 1 && k !== "中/英") el.classList.add("wide");
    if (k === "中/英" || k === "⌫" || k === "Enter" || k === "空格")
      el.classList.add("fn");
    el.addEventListener("mousedown", e => { e.preventDefault(); pressKey(k); });
    div.appendChild(el);
  });
  kb.appendChild(div);
});

/* ───────── 输入法状态 ───────── */
let mode = "zh";
let buffer = "";
let committed = "";
let candList = [];

const DICT = {
  ni:   ["你","呢","泥","拟","倪"],
  hao:  ["好","号","浩","豪","耗"],
  wo:   ["我","窝","握","卧","沃"],
  zai:  ["在","再","载","仔","宰"],
  dao:  ["到","道","倒","岛","导"],
  di:   ["底","地","第","低","滴"],
  bu:   ["不","部","步","布","补"],
  shi:  ["是","时","事","十","史"],
  de:   ["的","得","地","德","底"],
  ma:   ["吗","妈","码","马","骂"],
  hui:  ["会","回","汇","辉","绘"],
  yi:   ["一","以","已","意","依"],
};

const imeTag = document.getElementById("imeTag");
const comp = document.getElementById("comp");
const done = document.getElementById("done");
const ph   = document.getElementById("ph");
const cands = document.getElementById("cands");

function renderCands(){
  cands.innerHTML = "";
  candList.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "cand" + (i === 0 ? " on" : "");
    el.innerHTML = `<span class="num">${i+1}</span><span>${c}</span>`;
    el.addEventListener("mousedown", e => { e.preventDefault(); commit(c); });
    cands.appendChild(el);
  });
  if (!candList.length){
    const el = document.createElement("span");
    el.style.cssText = "font-size:11px;color:#4f4f4f";
    el.textContent = mode === "zh" ? "（等待键入按键）" : "（英文模式：直接上屏）";
    cands.appendChild(el);
  }
}

function renderField(){
  done.textContent = committed;
  comp.textContent = buffer;
  ph.style.display = (committed || buffer) ? "none" : "inline";
}

function refreshCands(){
  if (mode === "en" || !buffer){ candList = []; renderCands(); return; }
  candList = DICT[buffer] || [buffer.toUpperCase()];
  renderCands();
}

function flash(el){
  el.classList.add("active");
  setTimeout(() => el.classList.remove("active"), 180);
}

function pressKey(k){
  const el = [...document.querySelectorAll(".key")].find(e => e.dataset.k === k);
  if (el) flash(el);

  if (k === "中/英"){
    mode = mode === "zh" ? "en" : "zh";
    buffer = ""; candList = [];
    imeTag.textContent = mode === "zh" ? "中文（拼音）" : "英文";
    renderCands(); renderField();
    return;
  }
  if (k === "⌫"){
    buffer = buffer.slice(0, -1);
    refreshCands(); renderField();
    return;
  }
  if (k === "空格"){
    if (mode === "zh"){
      if (candList.length) commit(candList[0]);
      else { committed += " "; }
    } else { committed += " "; }
    renderField(); return;
  }
  if (k === "Enter"){ send(); return; }
  if (k === "，" || k === "？"){ committed += k; renderField(); return; }
  if (mode === "en"){ committed += k; renderField(); return; }

  buffer += k;
  refreshCands(); renderField();
}

function commit(ch){
  committed += ch;
  buffer = ""; candList = [];
  renderCands(); renderField();
}

function appendMessage(role, text){
  const div = document.createElement("div");
  div.className = "msg " + role;
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = role === "user" ? "用户" : "AI";
  div.appendChild(who);
  div.appendChild(document.createTextNode(text));
  const log = document.getElementById("log");
  log.appendChild(div);
  log.scrollTop = 1e9;
}

function send(){
  const text = (committed + buffer).trim();
  if (!text){ return; }
  appendMessage(SIDE, text);
  outbox.push({role: SIDE, text: text});
  committed = ""; buffer = ""; candList = [];
  renderCands(); renderField();
}

/* 对端消息只负责显示，不进入 outbox，避免两个窗口来回复制。 */
function qdrnAppendMessage(role, text){
  role = role === "user" ? "user" : "ai";
  text = String(text).trim();
  if (text) appendMessage(role, text);
}

function qdrnTakeOutbox(){
  const pending = outbox.slice();
  outbox.length = 0;
  return JSON.stringify(pending);
}

document.getElementById("send").addEventListener("mousedown", e => { e.preventDefault(); send(); });

/* ───────── 光标：坐标全部换算到 #app（390×844）坐标系 ───────── */
const app  = document.getElementById("app");
const cur  = document.getElementById("cursor");
const ap   = document.getElementById("aperture");
const ring = document.getElementById("clickring");
const curXY = document.getElementById("curXY");
const viewY = document.getElementById("viewY");

const W = 390, H = 844, AP_H = 192;

function clamp(value, low, high){
  return Math.max(low, Math.min(high, Number(value) || 0));
}

/* 虚拟光标和视野分别由 Python 控制，二者不联动。 */
function placeCursor(x, y){
  x = clamp(x, 0, W);
  y = clamp(y, 0, H);
  cur.style.left = x + "px";
  cur.style.top  = y + "px";
  curXY.textContent = Math.round(x) + ", " + Math.round(y);
}

function placeView(y){
  /* 采样窗满宽，横向固定居中，只允许上下移动。 */
  const ay = clamp(y, AP_H / 2, H - AP_H / 2);
  ap.style.left = (W / 2) + "px";
  ap.style.top  = ay + "px";
  viewY.textContent = Math.round(ay);
}

function qdrnSetState(x, y, viewCenterY){
  placeCursor(x, y);
  placeView(viewCenterY);
}

function qdrnLastMessageCount(){
  return document.querySelectorAll("#log > div").length;
}

/* 网络点击：显示点击环，并向光标下的真实控件派发完整点击事件。 */
function qdrnClick(x, y){
  placeCursor(x, y);
  ring.style.left = x + "px";
  ring.style.top  = y + "px";
  ring.classList.remove("go");
  void ring.offsetWidth;
  ring.classList.add("go");

  const r = app.getBoundingClientRect();
  const clientX = r.left + x, clientY = r.top + y;
  const target = document.elementFromPoint(clientX, clientY);
  if (!target) return;
  for (const type of ["mousedown", "mouseup", "click"]){
    const event = new MouseEvent(type, {
      bubbles:true, cancelable:true, view:window,
      clientX, clientY, button:0,
    });
    event.__qdrn = true;
    target.dispatchEvent(event);
  }
}

if (IS_USER){
  /* 用户端由真人直接点击软键盘，不显示网络的虚拟光标与采样窗。 */
  document.getElementById("sideTag").textContent = "用户端";
  cur.style.display = "none";
  ap.style.display = "none";
  ring.style.display = "none";
} else {
  /* AI 端：人类鼠标/触摸不能移动虚拟光标，也不能绕过网络直接操作 UI。 */
  for (const type of ["mousemove", "mousedown", "mouseup", "click", "wheel", "touchstart", "touchmove"]){
    document.addEventListener(type, event => {
      if (!event.__qdrn){
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, { capture:true, passive:false });
  }
}

/* 初始：光标与视野都位于屏幕中央，但之后各自独立。 */
placeCursor(W / 2, H / 2);
placeView(H / 2);
document.getElementById("log").scrollTop = 1e9;
renderCands(); renderField();
</script>
</body>
</html>
